[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsos-ingest"
version = "0.1.0"
description = "Canonical event schema and signed ingestion front door for OpsOS."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
opsos-ingest = "opsos_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
