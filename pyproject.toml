[project]
name = "opsos"
version = "1.0.0"
description = "Foundation for reliable, human-supervised AI operations."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<6",
  "dramatiq[redis]>=1.17,<2",
  "pyyaml>=6,<7",
  "cryptography>=43,<45",
  "google-api-python-client>=2.170,<3",
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "packages/opsos-ingest/src"]
testpaths = ["apps/api/tests", "packages/opsos-ingest/tests"]

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
